[workspace]
resolver = "3"
members = [
    "apps/tessel",
    "crates/tessel-core",
    "crates/tessel-clipboard",
    "spikes/ime-input",
    "spikes/search-bench",
    "spikes/clip-capture",
    "spikes/startup-probe",
    "spikes/webview-baseline",
    "tools/icon-gen",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tessel-core = { path = "crates/tessel-core" }
tessel-clipboard = { path = "crates/tessel-clipboard" }
rusqlite = { version = "0.43", features = ["bundled"] }
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
toml_edit = "0.25"
serde_json = "1"
uuid = { version = "1.29", features = ["v7"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
# GPUI 处于 1.0 之前，API 变动频繁：一律精确锁定版本，升级时单独提 PR 并做回归测试。
gpui-kit = "=0.10.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# 开发时依赖开启优化，GPUI 在 debug 模式下渲染很慢
[profile.dev.package."*"]
opt-level = 2
