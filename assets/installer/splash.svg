<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- 安装 / 更新时的启动画面（vpk pack 的 splashImage 参数）。由 tools/icon-gen 渲染成 splash.png。
       安装和更新都会显示它，所以文字保持中性；底部留给 Velopack 画进度条。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F7FF"/>
      <stop offset="1" stop-color="#E8EAFE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#glow)"/>

  <!-- 右上角淡淡的瓷砖，呼应图标的"拼贴" -->
  <g fill="url(#tile)">
    <rect x="452" y="-26" width="92" height="92" rx="22" opacity="0.16"/>
    <rect x="556" y="-26" width="92" height="92" rx="22" opacity="0.10"/>
    <rect x="556" y="78" width="92" height="92" rx="22" opacity="0.18"/>
    <rect x="452" y="78" width="92" height="92" rx="22" opacity="0.07"/>
    <rect x="556" y="182" width="92" height="92" rx="22" opacity="0.06"/>
  </g>

  <image href="../brand/tessel.svg" x="64" y="118" width="124" height="124"/>

  <text x="214" y="176" font-family="Segoe UI Variable Display, Segoe UI" font-size="50" font-weight="600"
        fill="#1E1B4B" letter-spacing="-0.5">Tessel</text>
  <text x="372" y="176" font-family="Microsoft YaHei UI, Microsoft YaHei" font-size="30" font-weight="400"
        fill="#6366F1">拼贴</text>
  <text x="216" y="214" font-family="Microsoft YaHei UI, Microsoft YaHei" font-size="18" fill="#4338CA">
    剪贴板管理器 · 每一次复制，都拼进你的工作里
  </text>
  <text x="216" y="240" font-family="Segoe UI" font-size="15" fill="#64748B">
    An open-source clipboard manager for Windows
  </text>

  <text x="64" y="352" font-family="Microsoft YaHei UI, Microsoft YaHei" font-size="13" fill="#64748B">
    正在准备 Tessel…  ·  Getting Tessel ready…
  </text>
</svg>
