<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- ≤32px 用的简化版：去掉槽位、阴影和文字线，瓷砖更大、间距更小，保证 16px 下清晰 -->
  <defs>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4C0FD"/><stop offset="1" stop-color="#94A3FB"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94A3FB"/><stop offset="1" stop-color="#7180F4"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CDC3FD"/><stop offset="1" stop-color="#9A7BF7"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.6" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#t1)"/>
  <rect x="136" y="8" width="112" height="112" rx="30" fill="url(#t2)"/>
  <rect x="8" y="136" width="112" height="112" rx="30" fill="url(#t3)"/>
  <rect x="136" y="136" width="112" height="112" rx="30" fill="url(#hero)"/>
</svg>
