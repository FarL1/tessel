name: Release

# 推送 v* 标签（如 v0.1.0）时：编译 → 用 Velopack 打包 → 创建 GitHub Release 并上传安装包。
# 标签版本必须和 Cargo.toml 的 workspace 版本一致。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VPK_VERSION: "1.2.161" # 必须和 apps/tessel/Cargo.toml 里的 velopack 版本一致

jobs:
  windows:
    # 0.1.x 是内部测试版：补推的历史标签只用于 CHANGELOG 的版本对比链接，不再打包
    if: ${{ !startsWith(github.ref_name, 'v0.1.') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo version
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object name -eq 'tessel' | ForEach-Object version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "标签 ${{ github.ref_name }} 与 Cargo 版本 v$version 不一致"
          }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install -g vpk --version $env:VPK_VERSION

      - name: Build installer
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: softprops/action-gh-release@v3
        with:
          draft: true # 先建草稿，人工检查后再发布
          generate_release_notes: true
          files: dist/*
