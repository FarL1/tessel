[package]
name = "tessel"
description = "Tessel · 拼贴 — native, keyboard-first clipboard manager (desktop app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "tessel"
path = "src/main.rs"

[dependencies]
tessel-core.workspace = true
tessel-clipboard.workspace = true
gpui-kit.workspace = true
global-hotkey = "0.10"
async-channel = "2"
raw-window-handle = "0.6"
tray-icon = "0.26"
# 安装与自动更新。版本必须和打包工具 vpk 一致（dotnet tool install -g vpk --version 1.2.161）
velopack = "=1.2.161"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
