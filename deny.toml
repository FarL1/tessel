[licenses]
# 只允许与 MIT OR Apache-2.0 兼容的许可证
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  # webpki-roots（Mozilla 根证书数据）
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# GPUI 生态里同一个库的多个版本很常见，只提示不阻止
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
