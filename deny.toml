# cargo-deny 配置：https://embarkstudios.github.io/cargo-deny/
# 本地运行：cargo deny check

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# RustSec 漏洞库：有已知漏洞的依赖会让检查失败
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "zip 8.6（经 velopack 1.2.161 引入）的解压漏洞；Tessel 只用 VelopackApp 安装/卸载钩子，不调用 UpdateManager，走不到解压代码。M2 开启自动更新前必须升级到 velopack 1.3（zip >= 9.0.5）并删除这些条目" },
